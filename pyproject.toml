[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turtlebot3-multimodal-core"
version = "0.3.0"
description = "Safe structured multimodal command core for TurtleBot3"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "FengDK666"}]
dependencies = ["matplotlib>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
turtlebot-command-evaluation = "turtlebot3_multimodal.evaluate_cli:main"

[tool.setuptools.packages.find]
include = ["turtlebot3_multimodal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
