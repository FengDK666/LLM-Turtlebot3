name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: turtlebot-command-evaluation --output-dir /tmp/turtlebot3-evaluation

  ros2-humble:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble
      - run: sudo apt-get update
      - run: sudo apt-get install -y ros-humble-geometry-msgs ros-humble-std-msgs ros-humble-std-srvs python3-colcon-common-extensions
      - run: colcon build
      - run: colcon test
      - run: colcon test-result --verbose
      - run: scripts/ros_smoke.sh
